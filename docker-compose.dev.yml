services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aiefactura
      POSTGRES_PASSWORD: aiefactura_dev
      POSTGRES_DB: aiefactura
    ports:
      # 5433 pe host: 5432 e deja ocupat de o instanță PostgreSQL nativă existentă pe mașină.
      - "5433:5432"
    volumes:
      - aiefactura_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiefactura -d aiefactura"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aiefactura_pgdata:
